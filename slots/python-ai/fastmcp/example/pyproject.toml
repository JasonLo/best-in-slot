[project]
name = "fastmcp-example"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["fastmcp>=3"]

[project.scripts]
fastmcp-example = "fastmcp_example.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
