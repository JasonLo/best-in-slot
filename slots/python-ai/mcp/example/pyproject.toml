[project]
name = "mcp-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp>=1.0"]

[project.scripts]
mcp-example = "mcp_example.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
