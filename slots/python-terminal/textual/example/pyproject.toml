[project]
name = "textual-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["textual>=4.0"]

[project.scripts]
textual-example = "textual_example.app:run"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "textual-dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
