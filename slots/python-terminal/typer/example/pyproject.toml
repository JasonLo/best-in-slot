[project]
name = "typer-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["typer>=0.15"]

[project.scripts]
typer-example = "typer_example.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
