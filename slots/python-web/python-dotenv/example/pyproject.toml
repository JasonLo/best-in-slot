[project]
name = "python-dotenv-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1.0"]

[project.scripts]
dotenv-example = "python_dotenv_example.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
